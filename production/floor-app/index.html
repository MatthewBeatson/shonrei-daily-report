<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Shonrei Production - Report Run</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="screen">
    <header>
      <h1>Shonrei Production</h1>
    </header>

    <nav class="tab-bar" id="tabBar">
      <button class="tab-btn active" id="tabBtnBatches" data-tab="batches">Batches</button>
      <button class="tab-btn" id="tabBtnStocktake" data-tab="stocktake">Stocktake</button>
      <button class="tab-btn" id="tabBtnPutaway" data-tab="putaway">Putaway</button>
    </nav>

    <!-- ===================== BATCHES TAB ===================== -->
    <div class="tab-panel" id="tabBatches">
      <div class="tab-panel-header">
        <button class="scan-again" id="rescanBtn" hidden>Pick another</button>
      </div>

      <!-- Step 1: barcode scan or manual code entry against a priority
           batch (Shonrei's real "sublist"), falling back to a tappable
           list ordered by priority (oldest SO first). A hardware barcode
           scanner wedges keystrokes + Enter into whatever text input has
           focus, so this one field serves both barcode and manual entry
           with no camera/scanning library needed. -->
      <section class="scan-card" id="scanStep">
        <div class="scan-input-row">
          <label for="batchCodeInput">Scan or enter batch code</label>
          <input type="text" id="batchCodeInput" inputmode="text" autocomplete="off"
                 autocapitalize="characters" placeholder="B-XXXXXX-XXXXXX" autofocus>
        </div>
        <div id="scanError" class="scan-error" hidden></div>

        <div class="run-list-heading">Or pick from today's priority list</div>
        <div id="runListEmpty">Loading...</div>
        <div id="runList" hidden></div>
        <div>
          <button id="refreshBtn">Refresh list</button>
        </div>
      </section>

      <!-- Step 2: confirm/adjust the actual quantity made -->
      <section class="run-card" id="confirmStep" hidden>
        <div class="product" id="productName"></div>
        <div class="planned" id="plannedLine"></div>
        <div class="batch-code" id="batchCodeLine"></div>

        <div class="qty-block">
          <label>Actual quantity made</label>
          <div class="qty-stepper">
            <button id="qtyDown" aria-label="decrease">&minus;</button>
            <span class="value" id="qtyValue">0</span>
            <button id="qtyUp" aria-label="increase">+</button>
          </div>
        </div>

        <button class="reject-toggle" id="rejectToggle">+ record rejects/scrap</button>
        <div class="reject-block" id="rejectBlock" hidden>
          <span>Rejected:</span>
          <input type="number" id="rejectValue" min="0" value="0">
        </div>

        <button class="confirm-btn as-planned" id="confirmPlannedBtn">
          Made as planned &mdash; confirm
        </button>
        <button class="confirm-btn" id="confirmActualBtn" hidden>
          Submit
        </button>
        <button class="print-label-btn" id="printBatchLabelBtn">Print batch label</button>
      </section>

      <!-- Step 3: done -->
      <section class="done-card" id="doneStep" hidden>
        <div class="icon">&#10003;</div>
        <p id="doneMessage">Reported. Cin7 will be updated automatically.</p>
        <!-- FP: shown automatically after submit (see submitBatch) -- one
             label per good unit, since these need a label on the back of
             each item. SA/RM/unknown: not auto-prompted, but the button
             stays available on request -- e.g. WIP110, stored 1000s to a
             carton, only needs the one SKU label for the carton. -->
        <button class="print-label-btn" id="printSkuLabelBtn" hidden>Print SKU label</button>
        <button id="doneRescanBtn">Report another</button>
      </section>
    </div>

    <!-- ===================== STOCKTAKE TAB ===================== -->
    <div class="tab-panel" id="tabStocktake" hidden>
      <div class="tab-panel-header">
        <button class="scan-again" id="stCountAgainBtn" hidden>Count another</button>
      </div>

      <!-- Step 1: barcode scan or manual SKU entry -- any SKU, any time,
           same rolling-log workflow the old Google Sheet + AppSheet setup
           used (not a "session" you open and close). -->
      <section class="scan-card" id="stScanStep">
        <div class="scan-input-row">
          <label for="stSkuInput">Scan or enter SKU</label>
          <input type="text" id="stSkuInput" inputmode="text" autocomplete="off"
                 autocapitalize="characters" placeholder="e.g. FG-2400-BOX">
        </div>
        <div id="stScanError" class="scan-error" hidden></div>
        <div>
          <button id="stLookupBtn">Count this SKU</button>
        </div>
      </section>

      <!-- Step 2: enter the counted quantity -->
      <section class="run-card" id="stCountStep" hidden>
        <div class="product" id="stSkuLine"></div>
        <div class="planned" id="stLastCountLine"></div>

        <div class="qty-block">
          <label>Counted quantity</label>
          <div class="qty-stepper">
            <button id="stQtyDown" aria-label="decrease">&minus;</button>
            <span class="value" id="stQtyValue">0</span>
            <button id="stQtyUp" aria-label="increase">+</button>
          </div>
        </div>

        <div class="scan-input-row">
          <label for="stLocationInput">Location (optional)</label>
          <input type="text" id="stLocationInput" autocomplete="off" placeholder="e.g. Warehouse A">
        </div>

        <button class="confirm-btn as-planned" id="stSubmitBtn">
          Submit count
        </button>
      </section>

      <!-- Step 3: done -->
      <section class="done-card" id="stDoneStep" hidden>
        <div class="icon">&#10003;</div>
        <p id="stDoneMessage"></p>
        <button id="stDoneAgainBtn">Count another</button>
      </section>
    </div>

    <!-- ===================== PUTAWAY TAB ===================== -->
    <!-- The fix for "product placed anywhere": scan what you're putting
         away, then scan the bin's own location label -- two separate
         barcodes, see production/README.md. Told immediately whether
         they match. -->
    <div class="tab-panel" id="tabPutaway" hidden>
      <div class="tab-panel-header">
        <button class="scan-again" id="paAgainBtn" hidden>Scan another</button>
      </div>

      <section class="scan-card" id="paSkuStep">
        <div class="scan-input-row">
          <label for="paSkuInput">1. Scan or enter product SKU</label>
          <input type="text" id="paSkuInput" inputmode="text" autocomplete="off"
                 autocapitalize="characters" placeholder="e.g. FG-2400-BOX">
        </div>
        <div>
          <button id="paSkuNextBtn">Next</button>
        </div>
      </section>

      <section class="scan-card" id="paLocationStep" hidden>
        <div class="product" id="paSkuLine" style="margin-bottom:10px;"></div>
        <div class="scan-input-row">
          <label for="paLocationInput">2. Scan or enter the bin's location code</label>
          <input type="text" id="paLocationInput" inputmode="text" autocomplete="off"
                 autocapitalize="characters" placeholder="e.g. A-03-02">
        </div>
        <div>
          <button id="paLocationSubmitBtn">Confirm placement</button>
        </div>
      </section>

      <section class="run-card" id="paResultStep" hidden>
        <div id="paResultIcon" class="pa-result-icon"></div>
        <p id="paResultMessage" class="pa-result-message"></p>
      </section>
    </div>
  </div>

  <script src="/production/floor-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
